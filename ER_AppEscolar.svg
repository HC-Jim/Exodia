<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="540" fill="#F4F5FB"/>
  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#4B3FB0">AppEscolar — Modelo de datos (5 tablas)</text>
  <text x="490" y="62" text-anchor="middle" font-size="12" fill="#6B6A7C">Relaciones por valor (sin llave foranea rigida): usuario_id y movilidad</text>

  <!-- ============ RELACION 1: usuarios (1) a asistencias (N) ============ -->
  <line x1="330" y1="235" x2="470" y2="195" stroke="#16A34A" stroke-width="2.5"/>
  <circle cx="330" cy="235" r="4" fill="#16A34A"/>
  <circle cx="470" cy="195" r="4" fill="#16A34A"/>
  <text x="344" y="229" font-size="13" font-weight="bold" fill="#16A34A">1</text>
  <text x="452" y="189" font-size="13" font-weight="bold" fill="#16A34A">N</text>
  <g>
    <rect x="356" y="203" width="90" height="22" rx="11" fill="#22C55E"/>
    <text x="401" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">usuario_id</text>
  </g>

  <!-- ============ RELACION 2: usuarios (N) a ubicaciones (1) ============ -->
  <line x1="330" y1="330" x2="470" y2="380" stroke="#D97706" stroke-width="2.5"/>
  <circle cx="330" cy="330" r="4" fill="#D97706"/>
  <circle cx="470" cy="380" r="4" fill="#D97706"/>
  <text x="344" y="346" font-size="13" font-weight="bold" fill="#D97706">N</text>
  <text x="452" y="376" font-size="13" font-weight="bold" fill="#D97706">1</text>
  <g>
    <rect x="356" y="344" width="86" height="22" rx="11" fill="#F59E0B"/>
    <text x="399" y="359" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">movilidad</text>
  </g>

  <!-- ===================== USUARIOS ===================== -->
  <g>
    <rect x="70" y="110" width="260" height="330" rx="10" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="2.5"/>
    <path d="M70 120 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v24 h-260 z" fill="#6C5CE7"/>
    <text x="200" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">usuarios</text>
    <g font-size="12" fill="#1C1B2E">
      <text x="86" y="166" font-weight="bold" fill="#4B3FB0">PK  id</text>
      <text x="86" y="187">nombre</text>
      <text x="86" y="207">correo  (unico)</text>
      <text x="86" y="227">contrasena</text>
      <text x="86" y="247">pregunta / respuesta</text>
      <text x="86" y="267" font-weight="bold">rol  (ESTUDIANTE | CONDUCTOR)</text>
      <text x="86" y="287">estudiante_nombre / grado</text>
      <text x="86" y="307" font-weight="bold" fill="#B45309">movilidad</text>
      <text x="86" y="327">lat / lng</text>
      <text x="86" y="347">estado</text>
      <text x="86" y="367">celular, dni, licencia,</text>
      <text x="86" y="385">placa, zona, contacto_emer.</text>
      <text x="86" y="407" fill="#6B6A7C">creado_en</text>
    </g>
  </g>

  <!-- ===================== ASISTENCIAS ===================== -->
  <g>
    <rect x="470" y="120" width="235" height="150" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="2.5"/>
    <path d="M470 130 a10 10 0 0 1 10 -10 h215 a10 10 0 0 1 10 10 v24 h-235 z" fill="#22C55E"/>
    <text x="587" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">asistencias</text>
    <g font-size="12" fill="#1C1B2E">
      <text x="486" y="176" font-weight="bold" fill="#4B3FB0">PK  id</text>
      <text x="486" y="198" font-weight="bold" fill="#B45309">FK  usuario_id</text>
      <text x="486" y="220">dia</text>
      <text x="486" y="242">estado</text>
      <text x="486" y="262" fill="#6B6A7C">creado_en</text>
    </g>
  </g>

  <!-- ===================== UBICACIONES ===================== -->
  <g>
    <rect x="470" y="320" width="235" height="130" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M470 330 a10 10 0 0 1 10 -10 h215 a10 10 0 0 1 10 10 v24 h-235 z" fill="#F59E0B"/>
    <text x="587" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ubicaciones</text>
    <g font-size="12" fill="#1C1B2E">
      <text x="486" y="376" font-weight="bold" fill="#B45309">PK  movilidad</text>
      <text x="486" y="398">lat / lng</text>
      <text x="486" y="420" fill="#6B6A7C">actualizado_en</text>
    </g>
  </g>

  <!-- ===================== COMUNICADOS ===================== -->
  <g>
    <rect x="760" y="120" width="160" height="110" rx="10" fill="#FFFFFF" stroke="#EC4899" stroke-width="2.5"/>
    <path d="M760 130 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v24 h-160 z" fill="#EC4899"/>
    <text x="840" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">comunicados</text>
    <g font-size="12" fill="#1C1B2E">
      <text x="776" y="176" font-weight="bold" fill="#4B3FB0">PK  id</text>
      <text x="776" y="198">titulo</text>
      <text x="776" y="218">detalle / fecha</text>
    </g>
  </g>

  <!-- ===================== NOTAS ===================== -->
  <g>
    <rect x="760" y="300" width="160" height="110" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    <path d="M760 310 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v24 h-160 z" fill="#3B82F6"/>
    <text x="840" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">notas</text>
    <g font-size="12" fill="#1C1B2E">
      <text x="776" y="356" font-weight="bold" fill="#4B3FB0">PK  id</text>
      <text x="776" y="378">curso</text>
      <text x="776" y="398">detalle / valor</text>
    </g>
  </g>
  <text x="840" y="432" text-anchor="middle" font-size="10.5" fill="#6B6A7C" font-style="italic">globales (sin relacion)</text>

  <!-- ===================== LEYENDA ===================== -->
  <g font-size="11.5" fill="#1C1B2E">
    <text x="70" y="485" font-weight="bold">Como leer:  1 = uno,  N = muchos</text>
    <text x="70" y="506">usuarios 1 — N asistencias   (un estudiante tiene muchas asistencias, por usuario_id)</text>
    <text x="70" y="524">usuarios N — 1 ubicaciones   (muchos usuarios de un bus comparten una ubicacion, por movilidad)</text>
  </g>
</svg>
